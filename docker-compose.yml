services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kf_user
      POSTGRES_PASSWORD: kf_password
      POSTGRES_DB: knowledgeforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kf_user -d knowledgeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowledgeforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Ollama is NOT containerized here deliberately -- it needs direct GPU/CPU
# access for reasonable performance, which fights with Docker Desktop on
# Windows. Install it natively instead: https://ollama.com/download
# Phase 4's README section has the exact setup steps.

volumes:
  pgdata:
  redisdata:
