name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  # Eval gate is manual-only (see the eval-gate job) -- this lets you trigger
  # it from the Actions tab without needing to push a commit.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    # Only Redis is needed here -- every test that touches Postgres mocks
    # src.db directly (confirmed: all 50 tests pass locally with no Postgres
    # running at all). Only the semantic-cache tests need a real Redis, for
    # genuine cosine-similarity math rather than a mocked stand-in.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v
        env:
          REDIS_URL: redis://localhost:6379/0

  # Deliberately NOT run automatically on every push. This project's free-tier
  # LLM quotas are tight enough (as low as 20 requests/day on some models,
  # confirmed the hard way during development) that running a full 12-question
  # eval (~24 LLM calls) on every commit would burn through a day's quota
  # from CI alone. Trigger it manually from the Actions tab when you actually
  # want a scored run -- or delete this comment and add `push: branches:
  # [main]` above once you have more headroom (a paid tier, a dedicated CI key).
  eval-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kf_user
          POSTGRES_PASSWORD: kf_password
          POSTGRES_DB: knowledgeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kf_user -d knowledgeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply pgvector schema
        run: PGPASSWORD=kf_password psql -h localhost -U kf_user -d knowledgeforge -f sql/init.sql
      - name: Ingest sample doc
        env:
          DATABASE_URL: postgresql://kf_user:kf_password@localhost:5432/knowledgeforge
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'groq' }}
        run: python -m src.ingest
      - name: Run eval gate
        env:
          DATABASE_URL: postgresql://kf_user:kf_password@localhost:5432/knowledgeforge
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'groq' }}
        run: python -m src.eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.md

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        # GHCR (like all Docker registries) rejects uppercase in image names.
        # github.repository preserves your repo's actual casing (AI-AGENTIC),
        # so it must be lowercased explicitly -- GitHub Actions expressions
        # have no built-in toLower(), hence this shell step.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
